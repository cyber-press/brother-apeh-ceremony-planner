services:
  - type: web
    name: apeh-planner
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: apeh-planner-db
          property: connectionString

 databases:
  - name: apeh-planner-db
    databaseName: apeh_planner
    user: apeh_planner
    plan: free
